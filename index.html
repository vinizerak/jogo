<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Território</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #e9e6de;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  #app {
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: #fff;
  }
  #map {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    background: #eee;
  }
  .leaflet-control-attribution { font-size: 9px; }
  .leaflet-control-zoom { display: none; }

  .top-bar {
    position: absolute; top: 12px; left: 12px; right: 12px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 500;
  }
  .pill {
    background: rgba(255,255,255,0.95);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 500;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    color: #222;
  }
  .pill i { font-size: 15px; }

  .avatar-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: #1a1a1a; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    border: none;
  }

  .fab {
    position: absolute; z-index: 500;
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(255,255,255,0.97);
    box-shadow: 0 1px 6px rgba(0,0,0,0.2);
    border: none;
    display: flex; align-items: center; justify-content: center;
    color: #222;
  }
  .fab i { font-size: 21px; }

  .fab-recenter { right: 14px; bottom: 118px; }

  .conquer-fab {
    position: absolute; left: 50%; bottom: 28px;
    transform: translateX(-50%);
    z-index: 500;
    height: 60px; padding: 0 26px; border-radius: 30px;
    background: #1a1a1a; color: #fff; border: none;
    font-size: 15px; font-weight: 500;
    display: flex; align-items: center; gap: 9px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.28);
  }
  .conquer-fab i { font-size: 21px; }
  .conquer-fab:active { transform: translateX(-50%) scale(0.97); }
  .conquer-fab:disabled { opacity: 0.5; }

  .toast {
    position: absolute; left: 14px; right: 14px; bottom: 100px;
    z-index: 600;
    background: rgba(255,255,255,0.98);
    border-radius: 14px;
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.18);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }
  .toast i { font-size: 20px; flex-shrink: 0; }
  .toast .title { margin: 0; font-size: 14px; font-weight: 500; color: #1a1a1a; }
  .toast .sub { margin: 0; font-size: 12px; color: #6b6a66; }

  .legend {
    position: absolute; top: 60px; left: 12px; z-index: 500;
    background: rgba(255,255,255,0.95); border-radius: 10px; padding: 8px 10px;
    font-size: 11px; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; color: #333; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

  .loading-screen {
    position: absolute; inset: 0; z-index: 900;
    background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px;
  }
  .loading-screen i { font-size: 32px; color: #1a1a1a; }
  .loading-screen p { font-size: 14px; color: #6b6a66; margin: 0; }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <div class="top-bar">
    <div class="pill"><i class="ti ti-map-pin"></i> <span id="placeName">Localizando...</span></div>
    <button class="avatar-btn" aria-label="Seu perfil">VC</button>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-swatch" style="background:#5DCAA5"></span> Seu time</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#F0997B"></span> Rival A</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#7F77DD"></span> Rival B</div>
    <div class="legend-item"><span class="legend-swatch" style="background:#EF9F27"></span> Disputado (24h)</div>
  </div>

  <button class="fab fab-recenter" id="recenterBtn" aria-label="Centralizar no meu GPS">
    <i class="ti ti-locate" aria-hidden="true"></i>
  </button>

  <div class="toast" id="toast">
    <i class="ti ti-info-circle" aria-hidden="true"></i>
    <div>
      <p class="title" id="toastTitle">Título</p>
      <p class="sub" id="toastSub">Subtítulo</p>
    </div>
  </div>

  <button class="conquer-fab" id="conquerBtn">
    <i class="ti ti-camera" aria-hidden="true"></i>
    Conquistar
  </button>

  <div class="loading-screen" id="loadingScreen">
    <i class="ti ti-map-pin-filled"></i>
    <p>Obtendo sua localização...</p>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Turf.js/6.5.0/turf.min.js"></script>
<script src="capacitor.js"></script>
<script src="app.js"></script>

</body>
</html>
